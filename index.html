
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Organize your day!</p>

        <form id="form">
            <input type="text" id="text" placeholder="Enter a task...">
            <button type="submit" class="add">Add Task</button>
        </form>

        <p id="count">0 tasks left</p>

        <div class="filters">
            <button type="button" class="filter active" data-filter="all">All</button>
            <button type="button" class="filter" data-filter="active">Active</button>
            <button type="button" class="filter" data-filter="done">Done</button>
        </div>

        <ul id="list"></ul>

        <button type="button" id="clear">Clear Completed</button>
    </div>
</body>
</html>
